<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Campaign Sprinter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/logo.png" alt="logo" class="logo">
      <div class="brand-text">
        <div class="title">CAMPAIGN SPRINTER</div>
        <div class="subtitle">AIESEC in CINEC</div>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
      <a href="ogt.html" class="nav-link"><i class="fa-solid fa-briefcase"></i> oGT Performance</a>
      <a href="ogv.html" class="nav-link"><i class="fa-solid fa-earth-americas"></i> oGV Performance</a>
      <a href="submit-post.html" class="nav-link" hidden><i class="fa-solid fa-paper-plane"></i> Submit Post Details</a>
    </nav>
    <div class="nav-actions">
      <button id="loginBtn" class="btn primary" type="button" onclick="openLoginModal()"><i class="fa-regular fa-user"></i> Login / Sign Up</button>
    </div>
  </header>

  <main class="container">
    <section id="authModal" class="modal" role="dialog" aria-modal="true" aria-label="Account access">
      <div class="modal-content card">
      <button class="modal-close" type="button" aria-label="Close" onclick="closeLoginModal()">&times;</button>
      <div class="auth-tabs" id="authTabs">
        <button id="tabSignIn" class="tab active" onclick="switchAuthTab('signin')">Sign In</button>
        <button id="tabSignUp" class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form" onsubmit="event.preventDefault(); handleLogin();">
        <div class="field-group">
          <label><i class="fa-regular fa-envelope"></i> Email</label>
          <input id="loginEmail" type="email" required placeholder="name@aiesec.net">
        </div>
        <div class="field-group">
          <label><i class="fa-solid fa-lock"></i> Password</label>
          <input id="loginPassword" type="password" required placeholder="••••••••">
        </div>
        <div class="actions"><button type="submit" class="btn primary"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button></div>
      </form>

      <form id="signupForm" class="auth-form" style="display:none;" onsubmit="event.preventDefault(); handleSignUp();">
        <div class="field-group">
          <label><i class="fa-regular fa-user"></i> Full Name</label>
          <input id="signUpName" type="text" required placeholder="John Doe">
        </div>
        <div class="field-group">
          <label><i class="fa-regular fa-envelope"></i> Email</label>
          <input id="signUpEmail" type="email" required placeholder="name@aiesec.net">
        </div>
        <div class="field-group">
          <label><i class="fa-solid fa-lock"></i> Password</label>
          <input id="signUpPassword" type="password" required placeholder="••••••••">
        </div>
        <div class="field-group">
          <label><i class="fa-solid fa-sitemap"></i> Department</label>
          <select id="signUpDept" required>
            <option value="">Select department</option>
            <option value="oGT">oGT</option>
            <option value="oGV">oGV</option>
          </select>
        </div>
        <div class="actions"><button type="submit" class="btn primary"><i class="fa-solid fa-user-plus"></i> Create Account</button></div>
      </form>

      <div id="profileDashboard" class="profile-dashboard" style="display:none;margin-top:18px;">
        <div class="profile-header">
          <img id="profileImage" src="assets/logo.png" alt="Generated profile avatar" class="avatar">
          <div>
            <div id="profileName" class="profile-name">Member</div>
            <div id="profileDeptLabel"></div>
          </div>
        </div>
        <div class="profile-actions" style="margin-top:12px;">
          <button class="btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
      </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/firebase-app.js"></script>
</body>
</html>
